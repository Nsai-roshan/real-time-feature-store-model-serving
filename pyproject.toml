[project]
name = "realtime-feature-serving"
version = "0.1.0"
description = "Low-latency online feature serving with shadow model evaluation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "starlette>=0.40,<0.47",
  "uvicorn[standard]>=0.30,<1.0",
  "redis[hiredis]>=5.0,<6.0",
  "pydantic>=2.8,<3.0",
  "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "httpx>=0.27,<1.0",
  "fakeredis>=2.23,<3.0",
  "ruff>=0.6,<1.0",
]
feast = ["feast[redis]>=0.40,<1.0"]
loadtest = ["locust>=2.31,<3.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
